<html>
    <head>
        <title>
            Class-6
        </title>
    </head>

    <body>

        <form action="" method="">
            <label for="">Name:</label>
        <input type="text" placeholder="Enter your name" value="" name="" id="">
        <br> <br>
        <label for="">Phone:</label>
        <input type="tel" placeholder="Enter your phone number" value="" name="" id="">
        <br> <br>
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your email" value="" name="" id="">
        <br> <br>
        <label for="">Password:</label>
        <input type="password" placeholder="Enter your password" value="" name="" id="">
        <br> <br>
        <label for="">Age:</label>
        <input type="number" placeholder="Eneter your age in digit" min="18" value="" name="" id="">
        <br> <br>
        <label for="">Your Date of Birth:</label>
        <input type="date" value="" name="" id="">
        <br> <br>
        <label for="">Blood Group:</label>
        <select name="" id="">
            <option value="">A+</option>
            <option value="">A-</option>
            <option value="">B+</option>
            <option value="">B-</option>
            <option value="">AB+</option>
            <option value="">AB-</option>
            <option value="">O+</option>
            <option value="">O-</option>
        </select>
        <br> <br>
        <label for="">Gender:</label> <br>
        <input type="radio" name="gender" id="" value="">Female <br>
        <input type="radio" name="gender" id="" value="">Male <br>
        <input type="radio" name="gender" id="" value="">Others <br>
        <br> <br>
        <label>Skills:</label>
        <input type="checkbox" name="" id="" value="">HTML
        <input type="checkbox" name="" id="" value="">CSS
        <input type="checkbox" name="" id="" value="">Bootstrap
        <input type="checkbox" name="" id="" value="">Photoshop

        <br> <br>
        <label for="">City:</label>
        <input type="text" placeholder="Your city" name="" value="" id="">
        <br> <br>
        <label for="">Zip Code:</label>
        <input type="number" placeholder="Your zip code" name="" value="" id="">
        <br> <br>
        <label for="">State:</label>
        <input type="text" placeholder="Your state" name="" value="" id="">
        <br> <br>
        <label for="">Your Full Address:</label>
        <textarea placeholder="Your full address" name="" id="" rows="10" cols="50"></textarea>

        <br> <br>
        <input type="submit" name="" value="Submit Now">
        </form>

        
    </body>
</html>
